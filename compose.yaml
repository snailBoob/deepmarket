services:
  deepmarket:
    image: ${DEEP_MARKET_IMAGE:-ghcr.io/snailboob/deepmarket:v1.1.1}
    ports:
      - "${DEEP_MARKET_BIND:-0.0.0.0}:${DEEP_MARKET_PORT:-8740}:8740"
    volumes:
      - market-data:/app/data
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  market-data:
